async function decrypt(pw){

  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.iter,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);

}
